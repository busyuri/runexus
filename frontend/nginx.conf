server {
  listen 80;

  location / {
    root /usr/share/nginx/html;
    index index.html;
    try_files $uri $uri/ /index.html;
  }

  location /api/ {
    proxy_pass http://runexus-backend-v3:8080;  # Backend container ismiyle eşleşmeli
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }
}

